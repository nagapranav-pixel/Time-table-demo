<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timetable UG1 • Monsoon 2026</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f1;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(#d9d7cf 1.5px,transparent 1.5px);background-size:38px 38px}
.wrap{max-width:820px;margin:auto;padding:34px 22px 70px;position:relative}
h1{font-size:42px;margin:0 0 10px;font-weight:800;letter-spacing:-2px}h1 span{color:#777}
.sub{font-size:18px;color:#777;margin-bottom:26px}.card{background:#fffdf8;border:2px solid #222;border-radius:24px;padding:22px;box-shadow:0 5px 0 #222;margin:18px 0}
input{width:100%;padding:17px;border:2px solid #222;border-radius:16px;font-size:18px;background:white}button{border:2px solid #222;border-radius:16px;padding:14px 20px;background:#f6e57a;font-size:17px;font-weight:750;box-shadow:0 4px 0 #222;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #222}.hidden{display:none}.error{color:#b3261e;margin-top:12px;font-weight:600}
.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.pill{display:inline-block;padding:9px 13px;border:1.5px solid #bbb;border-radius:999px;background:#fff;margin:5px 4px 0 0}
.daynav{display:flex;gap:7px;overflow:auto;padding:5px 0 12px}.daynav button{background:#fff;box-shadow:none;padding:10px 13px;min-width:70px}.daynav button.active{background:#f6e57a;box-shadow:0 3px 0 #222}
.item{display:grid;grid-template-columns:115px 1fr auto;gap:16px;align-items:center;border:1.5px solid #222;border-radius:20px;padding:17px;margin:12px 0;background:#fff}
.time{color:#777;font-size:14px;font-weight:650}.course{font-size:20px;font-weight:800}.room{font-size:14px;color:#777;margin-top:4px}.sec{font-size:13px;color:#777}.today{border:2px solid #e3c900;background:#fffef0}
.big{font-size:26px;font-weight:850}.muted{color:#777}.event{border-radius:18px;padding:16px;background:#fff0b2;border:1.5px solid #222;margin:12px 0;font-weight:700}
@media(max-width:600px){h1{font-size:34px}.item{grid-template-columns:1fr;gap:5px}.time{font-size:13px}.course{font-size:19px}}
</style></head>
<body><div class="wrap">
<div id="login">
<h1>Timetable<span>.UG1</span></h1><div class="sub">Monsoon 2026 • personalized timetable</div>
<div class="card"><div class="big">Enter your roll number</div><p class="muted">You only need to do this once on this device. Your roll number is checked by a separate timetable service.</p>
<input id="roll" placeholder="e.g. S20260010146" autocomplete="off"><br><br><button onclick="login()">Continue →</button><div id="err" class="error"></div></div>
</div>
<div id="app" class="hidden">
<div class="top"><div><h1>Timetable<span>.UG1</span></h1><div id="who" class="sub"></div></div>
<button onclick="changeRoll()">Change roll number</button></div>
<div id="status"></div>
<div class="daynav" id="days"></div>
<div id="content"></div>
</div></div>
<script>
const API_URL = "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE";
let user=null, selected=null;
function norm(x){return x.trim().toUpperCase().replace(/\s+/g,"")}
async function login(){
 const r=norm(document.getElementById("roll").value);
 const err=document.getElementById("err");
 err.textContent="";
 if(!/^S\d{11}$/.test(r)){err.textContent="Enter a valid roll number.";return}
 if(API_URL.includes("PASTE_YOUR")){err.textContent="The timetable API is not connected yet.";return}
 const btn=document.querySelector("#login button"); btn.disabled=true; btn.textContent="Checking…";
 try{
   const res=await fetch(API_URL+"?roll="+encodeURIComponent(r),{cache:"no-store"});
   const s=await res.json();
   if(!res.ok || !s.found){err.textContent="Roll number not found in the UG1 section data.";return}
   localStorage.setItem("ug1roll",r); user=s.student; selected=new Date(); show();
 }catch(e){err.textContent="Could not connect to the timetable service. Try again.";}
 finally{btn.disabled=false; btn.textContent="Continue →";}
}
function changeRoll(){localStorage.removeItem("ug1roll");location.reload()}
const order=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const dayMap={0:"Sunday",1:"Monday",2:"Tuesday",3:"Wednesday",4:"Thursday",5:"Friday",6:"Saturday"};
function dateKey(d){return d.toISOString().slice(0,10)}
function fmt(d){return d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})}
function effectiveDay(d){
 let k=dateKey(d);
 if(SPECIAL[k]==="Friday timetable") return "Friday";
 if(SPECIAL[k]==="Thursday timetable") return "Thursday";
 return dayMap[d.getDay()];
}
function show(){
 document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
 document.getElementById("who").textContent=`${user.name} • ${user.branch} • CP/DLD/OCW ${user.cp} • DSMA ${user.dsma}`;
 renderDays(); render(selected);
}
function renderDays(){
 const el=document.getElementById("days");el.innerHTML="";
 for(let i=0;i<7;i++){let d=new Date(selected);d.setDate(d.getDate()+i);let b=document.createElement("button");
 b.textContent=i===0?"Today":d.toLocaleDateString("en-IN",{weekday:"short"});b.onclick=()=>{selected=d;renderDays();render(d)};b.className=i===0?"active":"";el.appendChild(b)}
}
function render(d){
 const k=dateKey(d), day=effectiveDay(d), status=document.getElementById("status"), content=document.getElementById("content");
 let holiday=HOL[k], event=EVENTS[k], special=SPECIAL[k];
 status.innerHTML=`<span class="pill">📅 ${fmt(d)}</span>`+(holiday?`<span class="pill">🎉 ${holiday}</span>`:"")+(special?`<span class="pill">📌 ${special}</span>`:"");
 if(holiday||day==="Sunday"){content.innerHTML=`<div class="card"><div class="big">🎉 ${holiday||"Sunday"}</div><p class="muted">No regular classes.</p></div>`+(event?`<div class="event">📌 ${event}</div>`:"");return}
 let cpSec=user.cp.replace("Sec","");
 let list=(TT[day]||[]).filter(x=>{
   const [st,en,c,r,sec]=x;
   if(sec==="FHVE") return true;
   if(c==="DSMA") return sec==="DSMA"+user.dsma.replace("Sec","");
   if(c==="CP"||c==="DLD"||c==="OCW") return sec===c+cpSec;
   return false;
 });
 if(!list.length) content.innerHTML=`<div class="card"><div class="big">No classes 🎉</div><p class="muted">Nothing mapped for your sections on this day.</p></div>`;
 else content.innerHTML=list.map(x=>`<div class="item ${day===dayMap[new Date().getDay()]?"today":""}"><div class="time">${x[0]}–${x[1]}</div><div><div class="course">${NAMES[x[2]]||x[2]}</div><div class="room">📍 ${x[3]}</div></div><div class="sec">${x[4]}</div></div>`).join("");
 if(event) content.innerHTML=`<div class="event">📌 ${event}</div>`+content.innerHTML;
}
(async function(){
 let r=localStorage.getItem("ug1roll");
 if(!r || API_URL.includes("PASTE_YOUR")) return;
 try{const res=await fetch(API_URL+"?roll="+encodeURIComponent(r),{cache:"no-store"}); const s=await res.json(); if(res.ok&&s.found){user=s.student;selected=new Date();show();}}catch(e){}
})();
</script></body></html>
